name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Do not include real bank exports, account numbers or other personal financial data.** Use made-up sample data.
        Found a security issue? Please follow our [security policy](https://github.com/folioflux/.github/blob/main/SECURITY.md) instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, OS, runtime, browser, or anything else relevant.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots (with personal data removed), or links.
